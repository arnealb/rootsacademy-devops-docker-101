name: CI

on:
  pull_request:
    branches: [main]
    paths: ["2026/exercises/exercise-4-cicd/**"]

env:
  EX: 2026/exercises/exercise-4-cicd

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ruff pytest -r ${{ env.EX }}/lambda/requirements.txt
      - run: ruff check lambda tests
        working-directory: ${{ env.EX }}
      - run: pytest
        working-directory: ${{ env.EX }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
        working-directory: ${{ env.EX }}/terraform
      - run: terraform init -backend=false
        working-directory: ${{ env.EX }}/terraform
      - run: terraform validate
        working-directory: ${{ env.EX }}/terraform

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ra-cicd:pr-${{ github.event.number }} lambda
        working-directory: ${{ env.EX }}
