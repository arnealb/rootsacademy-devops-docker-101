name: CD (prod) — bonus

on:
  workflow_dispatch:
    inputs:
      dev_image_tag:
        description: "Image tag deployed to dev (from the CD (dev) run summary), e.g. dev-0.1.0-a1b2c3d"
        required: true

permissions:
  contents: read
  packages: read

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localhost:4566
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
        options: >-
          -v /var/run/docker.sock:/var/run/docker.sock
          --health-cmd "curl -f http://localhost:4566/_floci/health || exit 1"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Retag the exact image already running in dev — never rebuild for prod.
      # GHCR holds the one durable copy from the dev job; this run's Floci is a
      # fresh emulator (a different instance from the dev run), so the image
      # has to be pulled in again, not rebuilt.
      - name: Pull the dev image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$GHCR_IMAGE:${{ inputs.dev_image_tag }}"

      - uses: hashicorp/setup-terraform@v3
      - working-directory: terraform
        run: terraform init

      - name: Create the ECR repo in this run's Floci
        working-directory: terraform
        run: |
          terraform apply -auto-approve -target=aws_ecr_repository.app \
            -var environment=unused -var image_tag=unused -var ecr_host_endpoint=unused

      - name: Discover the registry's host-published port
        id: registry
        working-directory: terraform
        run: |
          REPO_NAME=$(terraform output -raw ecr_repository_name)
          PORT=$(docker port floci-ecr-registry 5000/tcp 2>/dev/null | head -1 | sed 's/.*://')
          echo "host=localhost:${PORT:-5100}" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Retag as prod and push into Floci's ECR
        id: push
        run: |
          PROD_TAG="prod-${{ inputs.dev_image_tag }}"
          REPO_URL="${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.repo_name }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ steps.registry.outputs.host }}"
          docker tag "$GHCR_IMAGE:${{ inputs.dev_image_tag }}" "$REPO_URL:$PROD_TAG"
          docker push "$REPO_URL:$PROD_TAG"
          echo "tag=$PROD_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy the Lambda
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var environment=prod \
            -var image_tag=${{ steps.push.outputs.tag }} \
            -var ecr_host_endpoint=${{ steps.registry.outputs.host }}

      - name: Smoke test
        run: |
          aws lambda invoke --function-name ra-cicd-prod --payload '{"queryStringParameters":{"name":"prod"}}' \
            --cli-binary-format raw-in-base64-out response.json
          grep -q '"hello, prod"' response.json
