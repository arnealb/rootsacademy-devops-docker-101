name: CD (prod) — bonus

on:
  workflow_dispatch:
    inputs:
      dev_image_tag:
        description: "Image tag deployed to dev (from the CD (dev) run summary), e.g. dev-0.1.0-a1b2c3d"
        required: true

permissions:
  contents: read
  packages: read

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localhost:4566
  ECR_REPOSITORY: ra-cicd
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Retag the exact image already running in dev — never rebuild for prod.
      # GHCR holds the one durable copy from the dev job; this run's Floci is a
      # fresh emulator, so the image has to be pulled in again, not rebuilt.
      - name: Pull the dev image and retag it as prod
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$GHCR_IMAGE:${{ inputs.dev_image_tag }}"

          aws ecr create-repository --repository-name "$ECR_REPOSITORY"
          REPO_URL=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
                       --query 'repositories[0].repositoryUri' --output text)
          echo "REPO_URL=$REPO_URL" >> "$GITHUB_ENV"
          PROD_TAG="prod-${{ inputs.dev_image_tag }}"
          echo "PROD_TAG=$PROD_TAG" >> "$GITHUB_ENV"

          aws ecr get-login-password | docker login --username AWS --password-stdin "$REPO_URL"
          docker tag "$GHCR_IMAGE:${{ inputs.dev_image_tag }}" "$REPO_URL:$PROD_TAG"
          docker push "$REPO_URL:$PROD_TAG"

      - uses: hashicorp/setup-terraform@v3

      - working-directory: terraform
        run: terraform init

      - working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var environment=prod \
            -var ecr_repository_url=$REPO_URL \
            -var image_tag=$PROD_TAG

      - name: Smoke test
        run: |
          aws lambda invoke --function-name ra-cicd-prod --payload '{"queryStringParameters":{"name":"prod"}}' \
            --cli-binary-format raw-in-base64-out response.json
          grep -q '"hello, prod"' response.json
