name: CD (dev)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # push to ghcr.io — the durable image store, see README

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localhost:4566
  ECR_REPOSITORY: ra-cicd
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships AWS CLI v2 already — AWS_ENDPOINT_URL above is enough to point it at Floci

      - id: tag
        run: |
          VERSION=$(grep -m1 version pyproject.toml | cut -d'"' -f2)
          echo "value=dev-${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build once
        run: docker build -t "$GHCR_IMAGE:${{ steps.tag.outputs.value }}" lambda

      # The durable copy: Floci resets on every job, so this is what "build once,
      # promote the same bytes to prod" retags from later — a real ECR would play this role.
      - name: Push the durable copy to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$GHCR_IMAGE:${{ steps.tag.outputs.value }}"

      - name: Create the ECR repo in this run's Floci and load the image into it
        run: |
          aws ecr create-repository --repository-name "$ECR_REPOSITORY"
          REPO_URL=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
                       --query 'repositories[0].repositoryUri' --output text)
          echo "REPO_URL=$REPO_URL" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REPO_URL"
          docker tag "$GHCR_IMAGE:${{ steps.tag.outputs.value }}" "$REPO_URL:${{ steps.tag.outputs.value }}"
          docker push "$REPO_URL:${{ steps.tag.outputs.value }}"

      - uses: hashicorp/setup-terraform@v3

      - working-directory: terraform
        run: terraform init

      - working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var environment=dev \
            -var ecr_repository_url=$REPO_URL \
            -var image_tag=${{ steps.tag.outputs.value }}

      - name: Smoke test
        run: |
          aws lambda invoke --function-name ra-cicd-dev --payload '{"queryStringParameters":{"name":"ci"}}' \
            --cli-binary-format raw-in-base64-out response.json
          grep -q '"hello, ci"' response.json
